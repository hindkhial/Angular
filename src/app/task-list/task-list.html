<section aria-labelledby="task-list-heading">
  <h2 id="task-list-heading">Liste des tâches</h2>
  <div aria-live="polite">
    @if (tasks.length === 0) {
      <p>Aucune tâche pour l’instant</p>
    } @else {
      <ul>
        @for (task of tasks; track task.id) {
          <li [style.color]="task.title | titleColor">
            {{ task.title | uppercase }} ·
            <time [attr.datetime]="task.dueDate">{{ task.dueDate | date:'dd/MM/yyyy' }}</time>
          </li>
        }
      </ul>
    }
  </div>
  <button type="button" (click)="clearTasks()" [disabled]="tasks.length === 0">
    Vider la liste
  </button>
</section>
